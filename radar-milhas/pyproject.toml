[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-milhas"
version = "0.1.0"
description = "Bot que busca diariamente passagens Brasil → Portugal/Espanha em dinheiro e em milhas (Smiles, Azul Fidelidade, LATAM Pass)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
