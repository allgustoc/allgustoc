<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Radar de Milhas{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><b>Radar de Milhas</b><span>Brasil para Portugal e Espanha</span></a>
    <nav class="small muted" aria-label="Fontes ativas">Fontes: {% for p in settings.providers %}{{ p | source }}{% if not loop.last %}, {% endif %}{% endfor %}</nav>
  </div>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
<script src="/static/app.js" defer></script>
</body>
</html>
